<!DOCTYPE html><html lang="en"><head>    <meta charset="utf-8"/>    <meta            content="width=device-width, initial-scale=1, shrink-to-fit=no"            name="viewport"    />    <meta content="" name="description"/>    <meta content="" name="author"/>    <title>Bookish</title>    {% block styles %}    {{ bootstrap.load_css() }}    <link            href="{{ url_for('static', filename='assets/favicon.ico') }}"            rel="icon"            type="image/x-icon"    />    <!-- Font Awesome icons (free version)-->    <script            crossorigin="anonymous"            src="https://use.fontawesome.com/releases/v6.3.0/js/all.js"    ></script>    <!-- Google fonts-->    <link            href="https://fonts.googleapis.com/css?family=Lora:400,700,400italic,700italic"            rel="stylesheet"            type="text/css"    />    <link href="https://fonts.googleapis.com" rel="preconnect">    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@100..900&family=Dancing+Script:wght@400..700&family=Fleur+De+Leah&family=Lavishly+Yours&family=Life+Savers:wght@400;700;800&display=swap"          rel="stylesheet">    <!-- Core theme CSS (includes Bootstrap)-->    <link            href="{{ url_for('static', filename='css/styles.css') }}"            rel="stylesheet"    />    <link    href="{{ url_for('static', filename='css/bookshelf.css') }}"    rel="stylesheet">    {% endblock %}</head><body><!-- Navigation--><nav class="navbar navbar-expand-lg fixed-top navbar-light" id="mainNav">    <div class="container px-4 px-lg-5">        <a class="navbar-brand" href="/"           style="font-family: 'Life Savers', cursive; font-size: 1.8rem;color:rgb(198 28 28)">Reading            room☕️💌📖</a>        <button                aria-controls="navbarResponsive"                aria-expanded="false"                aria-label="Toggle navigation"                class="navbar-toggler"                data-bs-target="#navbarResponsive"                data-bs-toggle="collapse"                type="button"        >            Menu            <i class="fas fa-bars"></i>        </button>        <div class="collapse navbar-collapse" id="navbarResponsive">            <ul class="navbar-nav ms-auto py-4 py-lg-0">                <li class="nav-item">                    <a                            class="nav-link px-lg-3 py-3 py-lg-4"                            href="{{ url_for('get_all_posts') }}"                    >Home</a                    >                </li>                {% if not current_user.is_authenticated %}                <li class="nav-item">                    <a                            class="nav-link px-lg-3 py-3 py-lg-4"                            href="{{ url_for('login') }}"                    >Login</a                    >                </li>                <li class="nav-item">                    <a                            class="nav-link px-lg-3 py-3 py-lg-4"                            href="{{ url_for('register') }}"                    >Register</a                    >                </li>                {% else %}                <li class="nav-item">                    <a                            class="nav-link px-lg-3 py-3 py-lg-4"                            href="{{ url_for('logout') }}"                    >Log Out</a                    >                </li>                {% endif %}            </ul>        </div>    </div></nav><script crossorigin="anonymous"        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
